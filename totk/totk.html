        <div class="main-menu">
            <nav class="filters">
                <input type="text" id="search-bar" placeholder="Search a piece of armor">
                <select name="order" id="order">
                    <option value="a-z">A-Z (default)</option>
                    <option value="z-a">Z-A</option>
                </select>
                <div class="switch-row">
                    <span>Obtained only</span>
                    <input type="checkbox" id="obtained-switch" class="switch-input">
                    <label for="obtained-switch" class="switch"></label>

                    <span>Not Obtained only</span>
                    <input type="checkbox" id="not-obtained-switch" class="switch-input">

            </nav>
