<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Zelda</title>
    <link rel="stylesheet" href="index.css">

</head>
<body>

<header>
    <h1>The Legends Of Zelda</h1>
</header>

<main id="main">
    <section class="chose-category">
        <article class="category" value="games">
            <h1>Games</h1>
            <img src="images/vb.jpg" alt="" class="background-category">
        </article>
        <article class="category" value="characters">
            <h1>Characters</h1>
            <img src="images/zelda-liste.jpg" alt="" class="background-category">
        </article>
        <article class="category" value="monsters">
            <h1>Monsters</h1>
            <img src="images/monster.avif" alt="" class="background-category">
        </article>
        <article class="category" value="bosses">
            <h1>Bosses</h1>
            <img src="images/Zelda-Tears-of-the-Kingdom-Ganondorf-interview.jpg" alt="" class="background-category">
        </article>
        <article class="category" value="dungeons">
            <h1>Dungeons</h1>
            <img src="images/dungeon.jpg" alt="" class="background-category">
        </article>
        <article class="category" value="places">
            <h1>Places</h1>
            <img src="images/village.webp" alt="" class="background-category">
        </article>
        <article class="category" value="items">
            <h1>Items</h1>
            <img src="images/item.webp" alt="" class="background-category">
        </article>
    </section>


</main>

</body>
<script src="index.js"></script>
</html>
